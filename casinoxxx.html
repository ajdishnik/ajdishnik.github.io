<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎰 Bitcoin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;      /* запрещает прокрутку корневого скролла */
}
body {
  min-height: 100vh;     /* fallback для старых браузеров */
  min-height: 100dvh;    /* динамический размер */
  min-height: 100svh;    /* small viewport — игнорирует клавиатуру */
  overflow: hidden;
}
  .casino {
    width: 100%; max-width: 520px; padding: 24px 20px;
    background: linear-gradient(180deg, #1e1428 0%, #14091f 100%);
    border-radius: 24px; text-align: center; position: relative;
    box-shadow: 0 25px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,213,74,0.15),
                inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .casino::before {
    content: ''; position: absolute; inset: -2px; border-radius: 26px; padding: 2px;
    background: linear-gradient(135deg, #ffd54a, #ff8a00, #ffd54a, transparent, #ffd54a);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.4; pointer-events: none;
  }
  h1 {
    font-size: 28px; letter-spacing: 1px;
    background: linear-gradient(180deg, #fff7c2, #ffd54a 40%, #ff8a00);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255,213,74,0.5); margin-bottom: 4px;
  }
  h1 .emoji {
    -webkit-text-fill-color: initial;
    -webkit-background-clip: initial;
    background: none; color: initial; display: inline-block;
  }
  .subtitle { color: #ffd54a; font-size: 22px; font-weight: 1000; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
  .toggle {
    width: 100%; padding: 10px 14px; margin-bottom: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,213,74,0.15);
    border-radius: 12px; color: #b8a0d0; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: all 0.2s; font-family: inherit;
  }
  .toggle:hover { border-color: rgba(255,213,74,0.4); color: #ffd54a; }
  .toggle::after { content: '▾'; transition: transform 0.25s; font-size: 14px; }
  .toggle.open::after { transform: rotate(180deg); }
  .collapse { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, margin 0.35s; text-align: left; margin-bottom: 0; }
  .collapse.open { max-height: 600px; margin-bottom: 16px; }
  .collapse.open.log { max-height: 400px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 5px; color: #9b86b8; font-size: 11px; letter-spacing: 0.5px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; background: rgba(0,0,0,0.35); color: #fff; font-size: 13px;
    outline: none; font-family: Consolas, monospace; transition: border 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: #ffd54a; box-shadow: 0 0 0 3px rgba(255,213,74,0.12); }
  input:disabled { opacity: 0.4; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .note { font-size: 10px; color: #6b5a80; margin-top: 4px; }
  .reels { display: flex; justify-content: center; gap: 10px; margin: 22px 0; }
  .reel {
    width: 96px; height: 110px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #0a0612, #150c22 50%, #0a0612);
    border: 2px solid #3a2a52; position: relative;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 20px rgba(0,0,0,0.5);
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .reel::before, .reel::after { content: ''; position: absolute; left: 0; right: 0; height: 24px; z-index: 2; pointer-events: none; }
  .reel::before { top: 0; background: linear-gradient(180deg, #0a0612, transparent); }
  .reel::after { bottom: 0; background: linear-gradient(0deg, #0a0612, transparent); }
  .reel.spinning { border-color: #ffd54a; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 25px rgba(255,213,74,0.4); }
  .reel.win { border-color: #54e878; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(84,232,120,0.8); animation: winPulse 0.6s infinite alternate; }
  .reel.stop { border-color: #ff5c5c; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,92,92,0.5); }
  @keyframes winPulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  .reel-strip { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .reel-strip span { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 48px; line-height: 1; flex-shrink: 0; }
  .controls { display: flex; gap: 10px; margin-top: 8px; }
  button.main {
    flex: 1; padding: 16px; border: 0; border-radius: 14px;
    background: linear-gradient(180deg, #ffe477, #ffb700);
    color: #2a1500; font-size: 16px; font-weight: 800; letter-spacing: 1.5px;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
    box-shadow: 0 6px 0 #a86e00, 0 10px 25px rgba(255,183,0,0.35);
    text-transform: uppercase;
  }
  button.main:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 #a86e00, 0 14px 30px rgba(255,183,0,0.5); }
  button.main:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #a86e00, 0 4px 12px rgba(255,183,0,0.35); }
  button.main:disabled { opacity: 0.5; cursor: not-allowed; }
  button.main.stop { background: linear-gradient(180deg, #ff7777, #d62828); color: #fff; box-shadow: 0 6px 0 #8a1a1a, 0 10px 25px rgba(214,40,40,0.4); }
  button.main.stop:hover:not(:disabled) { box-shadow: 0 8px 0 #8a1a1a, 0 14px 30px rgba(214,40,40,0.55); }
  button.mode { width: 54px; border: 1px solid rgba(255,213,74,0.25); background: rgba(255,255,255,0.04); border-radius: 14px; color: #b8a0d0; font-size: 20px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  button.mode:hover { border-color: #ffd54a; color: #ffd54a; }
  button.mode.auto-on { background: rgba(84,232,120,0.15); border-color: #54e878; color: #54e878; box-shadow: 0 0 15px rgba(84,232,120,0.3); }
  .result {
    margin-top: 16px; padding: 14px; border-radius: 12px; min-height: 80px;
    font-size: 12px; line-height: 1.7; font-family: Consolas, monospace; text-align: left;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06);
    color: #a090b8; transition: all 0.3s; word-break: break-all;
  }
  .result .line { margin: 2px 0; }
  .result .label { color: #6b5a80; }
  .result .key { color: #ffd54a; font-weight: bold; }
  .result .addr { color: #7ab8ff; }
  .result.searching { color: #ffd54a; border-color: rgba(255,213,74,0.3); }
  .result.stopped { color: #ff9c9c; }
  .result.win { background: linear-gradient(180deg, rgba(84,232,120,0.12), rgba(84,232,120,0.04)); border-color: #54e878; color: #c8ffd8; box-shadow: 0 0 25px rgba(84,232,120,0.3); }
  .result.win .key { color: #8fffb8; }
  .result.win .addr { color: #a8e0ff; }
  .progress { margin-top: 14px; height: 6px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
  .progress > div { height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(90deg, #ffd54a, #ff8a00); transition: width 0.2s linear; box-shadow: 0 0 10px rgba(255,183,0,0.6); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; font-size: 11px; color: #7a6a90; font-family: Consolas, monospace; }
  .stats b { color: #58a6ff; }
  .found { margin-top: 12px; padding: 12px; background: rgba(84,232,120,0.06); border: 1px solid rgba(84,232,120,0.25); border-radius: 10px; font-family: Consolas, monospace; font-size: 11px; text-align: left; }
  .found-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .found h4 { color: #54e878; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .found-clear {
    background: none; border: 1px solid rgba(84,232,120,0.35); color: #54e878;
    border-radius: 6px; padding: 3px 8px; font-size: 10px; font-family: inherit;
    cursor: pointer; transition: all 0.2s;
  }
  .found-clear:hover { background: rgba(84,232,120,0.15); border-color: #54e878; }
  .found-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .found .item { padding: 8px 10px; background: rgba(0,0,0,0.3); border-radius: 6px; line-height: 1.6; }
  .found .item:last-child { margin-bottom: 0; }
  .found .k { color: #8fffb8; font-weight: bold; word-break: break-all; }
  .found .a { color: #7ab8ff; word-break: break-all; }
  .found .n { color: #555; font-size: 10px; margin-right: 6px; }
  .blocklog { font-family: Consolas, monospace; font-size: 10px; }
  .blocklog h4 { color: #7ab8ff; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .blocklog .list { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 4px; }
  .blocklog .list::-webkit-scrollbar { width: 4px; }
  .blocklog .list::-webkit-scrollbar-thumb { background: rgba(255,213,74,0.3); border-radius: 2px; }
  .blocklog .row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.02); transition: background 0.25s; }
  .blocklog .row.fresh { background: rgba(255,213,74,0.12); }
  .blocklog .w { color: #555; min-width: 24px; }
  .blocklog .r { color: #7ab8ff; word-break: break-all; }
  .blocklog .arrow { color: #555; }
  .blocklog .len { color: #6b5a80; margin-left: auto; white-space: nowrap; }
  .blocklog .empty { color: #555; }
  .hint { margin-top: 10px; font-size: 10px; color: #4a3a5e; text-align: center; }
  .hint kbd { background: rgba(255,255,255,0.06); border-radius: 4px; padding: 1px 6px; color: #8b7aa8; font-family: Consolas, monospace; }

  .divider {
    width: 180px; height: 2px; margin: 12px auto;
    background: linear-gradient(90deg, transparent, #ffd700, #fff3a0, #ffd700, transparent);
    box-shadow: 0 0 6px #ffd700, 0 0 14px rgba(255, 215, 0, 0.6);
    border-radius: 50%;
  }
  .subtitle2 {
    font-size: 32px; font-weight: 900; text-align: center; letter-spacing: 2px;
    background: linear-gradient(180deg, #fff8c5 0%, #ffd700 35%, #ffae00 65%, #fff0a0 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 6px rgba(255, 193, 7, 0.45));
    margin-top: 12px;
  }
  .currency { font-size: 28px; }
  .usd { font-size: 16px; letter-spacing: 3px; }
</style>
</head>
<body>
<div class="casino">
  <h1><span class="emoji">🎰</span> BTC CASINO</h1>
  <div class="divider"></div>
  <div class="subtitle2"><span class="currency">$</span> 500 000 <span class="usd">USD</span></div>
  <div class="divider"></div>

  <button class="toggle" id="settingsToggle">⚙️ Настройки поиска</button>
  <div class="collapse" id="settings">
    <div class="field">
      <label>Префикс адреса</label>
      <input id="prefix" value="1PWo3JeB9jrG" placeholder="напр. 1Love">
    </div>
    <div class="field">
      <label>Суффикс (необязательно, медленнее)</label>
      <input id="suffix" value="" placeholder="напр. XXX">
    </div>
    <div class="field">
      <label>Диапазон ключей (hex)</label>
      <div class="row">
        <div><input id="start" value="400000000000000000" placeholder="от"></div>
        <div><input id="end" value="7fffffffffffffffff" placeholder="до"></div>
      </div>
    </div>
    <div class="field">
      <label>Размер блока</label>
      <input id="blockSize" value="10000">
      <div class="note">Меньше — чаще «прыжки», чуть медленнее</div>
    </div>
    <div class="field">
      <label>Потоков (воркеров)</label>
      <input id="threads" value="1">
      <div class="note">1 — минимум нагрева</div>
    </div>
  </div>

  <div class="reels">
    <div class="reel" id="reel0"><div class="reel-strip" id="strip0"></div></div>
    <div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>
    <div class="reel" id="reel2"><div class="reel-strip" id="strip2"></div></div>
  </div>

  <div class="controls">
    <button class="main" id="spin">🎲 КРУТИТЬ</button>
    <button class="mode" id="modeBtn" title="Авторежим">🔁</button>
  </div>

  <div class="result" id="result">Нажмите «Крутить», чтобы начать поиск</div>

  <div class="found" id="found" style="display:none">
    <div class="found-head">
      <h4>🏆 Найденные ключи</h4>
      <button class="found-clear" id="foundClear">✕ Очистить</button>
    </div>
    <div class="found-list" id="foundList"></div>
  </div>

  <button class="toggle" id="logToggle">🔍 Последние проверенные блоки</button>
  <div class="collapse log" id="logPanel">
    <div class="blocklog">
      <div class="list" id="blockList"><div class="empty">—</div></div>
    </div>
  </div>

  <div class="progress"><div id="progress"></div></div>

  <div class="stats">
    <div>Скорость: <b id="rate">0</b> k/s</div>
    <div>Проверено: <b id="count">0</b></div>
    <div>Прогресс: <b id="percent">0%</b></div>
    <div>Осталось: <b id="eta">—</b></div>
  </div>

  <div class="hint"><kbd>Enter</kbd> старт/стоп • <kbd>Esc</kbd> стоп</div>
</div>

<script>

const $ = id => document.getElementById(id);

function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { const t = b; b = a % b; a = t; } return a; }
function randomBigInt(bits) {
  const n = Math.ceil(bits / 8); const r = new Uint8Array(n);
  crypto.getRandomValues(r);
  let x = 0n; for (const b of r) x = (x << 8n) | BigInt(b);
  return x;
}
function randomCoprime(n) {
  if (n <= 1n) return 1n;
  const h = n / 2n;
  for (let i = 0; i < 200; i++) {
    let a = h + (randomBigInt(64) % (n - h));
    if (a <= 1n) a = 2n;
    if (gcd(a, n) === 1n) return a;
  }
  let a = h + 1n; while (gcd(a, n) !== 1n) a += 1n; return a;
}

    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2

  dv.setUint32(paddedLen - 4, bitLen >>> 0, false);

      const s0 = ((W[t-15]>>>7)|(W[t-15]<<25))^((W[t-15]>>>18)|(W[t-15]<<14))^(W[t-15]>>>3);

    }

}

/* ---------- Состояние воркера ---------- */
let running = false;
let prefix = '', suffix = '';
let workerId = 0, workerCount = 1;
let rangeS = 0n, rangeE = 0n, blockSize = 65536n;
let totalBlocks = 0n;
let permA = 1n, permB = 0n;
let maxBlocks = 0n;
let blocksDone = 0n;
let filterK = 0;
let filterMask = null;

let statCount = 0;
let lastReport = 0;

const BATCH = 256;
const PUB = new Uint8Array(33);

function bigToBytes32(x, out, off) {
  for (let i = 31; i >= 0; i--) { out[off + i] = Number(x & 0xffn); x >>= 8n; }
}

function nextBlock() {
  if (blocksDone >= maxBlocks) return null;

  /* Особый случай: один блок на всех — делим ключи между воркерами. */
  if (totalBlocks === 1n) {
    const span = rangeE - rangeS + 1n;
    const per = (span + BigInt(workerCount) - 1n) / BigInt(workerCount);
    const myS = rangeS + BigInt(workerId) * per;
    let myE = myS + per - 1n;
    if (myE > rangeE) myE = rangeE;
    if (myS > rangeE) return null;
    blocksDone += 1n;
    return { start: myS, end: myE };
  }

  const idx = BigInt(workerId) + blocksDone * BigInt(workerCount);
  if (idx >= totalBlocks) return null;
  const p = (permA * idx + permB) % totalBlocks;
  const bS = rangeS + p * blockSize;
  let bE = bS + blockSize - 1n;
  if (bE > rangeE) bE = rangeE;
  blocksDone += 1n;
  return { start: bS, end: bE };
}

function reportStat(force) {
  if (statCount === 0 && !force) return;
  self.postMessage({ type: 'STAT', count: statCount });
  statCount = 0;
}

function processBlock(bS, bE) {
  self.postMessage({ type: 'blockStart', start: bS.toString(16), end: bE.toString(16) });
  const sp = mulG(bS);
  if (!sp) return false;
  let X = sp[0], Y = sp[1], Z = 1n;
  let k = bS;

  const bX = new Array(BATCH), bY = new Array(BATCH), bZ = new Array(BATCH);
  const bK = new Array(BATCH);

  while (running && k <= bE) {
    let n = 0;
    for (let i = 0; i < BATCH; i++) {
      if (!running || k > bE) break;
      bX[n] = X; bY[n] = Y; bZ[n] = Z; bK[n] = k; n++;
      const nx = jacAdd(X, Y, Z, Gx, Gy);
      X = nx[0]; Y = nx[1]; Z = nx[2];
      k += 1n;
    }
    if (n === 0) break;
    bX.length = n; bY.length = n; bZ.length = n; bK.length = n;

    const res = batchAff(bX, bY, bZ);
    const aX = res[0], aY = res[1];

    for (let i = 0; i < n; i++) {
      if (!running) return false;
      PUB[0] = (aY[i] & 1n) ? 0x03 : 0x02;
      bigToBytes32(aX[i], PUB, 1);

      const s1 = sha256_33(PUB);
      const h  = ripemd160_32(s1);

      if (filterMask !== null) {
        let v = 0;
        for (let b = 0; b < filterK; b++) v = (v << 8) | h[b];
        if (!filterMask[v]) { statCount++; continue; }
      }

      const addr = h160ToAddr(h);
      if (addr.startsWith(prefix) && (!suffix || addr.endsWith(suffix))) {
        reportStat(true);
        self.postMessage({ type: 'HIT', key: bK[i].toString(16), addr });
        running = false;
        return true;
      }
      statCount++;
    }

    const now = Date.now();
    if (now - lastReport > 400) { reportStat(false); lastReport = now; }
  }
  return false;
}

self.onmessage = (e) => {
  const d = e.data;
  if (d.cmd === 'stop') { running = false; return; }
  if (d.cmd === 'run') {
    running = true;
    workerId = d.workerId;
    workerCount = d.workerCount;
    prefix = d.prefix; suffix = d.suffix || '';
    rangeS = BigInt('0x' + d.rangeS);
    rangeE = BigInt('0x' + d.rangeE);
    blockSize = BigInt(d.blockSize);
    totalBlocks = BigInt(d.totalBlocks);
    permA = BigInt(d.permA);
    permB = BigInt(d.permB);
    maxBlocks = BigInt(d.maxBlocks);
    blocksDone = 0n;
    filterK = d.filterK | 0;
    if (d.maskBuffer) {
      filterMask = new Uint8Array(d.maskBuffer);
    } else {
      filterMask = null;
    }
    statCount = 0;
    lastReport = Date.now();
    (function loop() {
      while (running) {
        const blk = nextBlock();
        if (!blk) break;
        const found = processBlock(blk.start, blk.end);
        if (found) { running = false; return; }
      }
      reportStat(true);
      self.postMessage({ type: 'done' });
    })();
  }
};
`;
}

/* ---------- Слоты ---------- */
const reels = [];
function randEmoji() { return EMOJIS[Math.floor(Math.random() * EMOJIS.length)]; }
for (let i = 0; i < 3; i++) {
  const strip = $('strip' + i);
  for (let j = 0; j < STRIP_LEN; j++) {
    const s = document.createElement('span'); s.textContent = randEmoji(); strip.appendChild(s);
  }
  reels.push({ strip, offset: 0, speed: 0, active: false, animId: null });
}
function startReel(r, speed) {
  r.active = true; r.speed = speed;
  if (r.animId) return;
  const tick = () => {
    if (!r.active) return;
    r.offset += r.speed;
    if (r.offset >= 110) {
      r.offset -= 110;
      const first = r.strip.firstChild;
      first.textContent = randEmoji();
      r.strip.appendChild(first);
    }
    r.strip.style.transform = `translateY(${-r.offset}px)`;
    r.animId = requestAnimationFrame(tick);
  };
  r.animId = requestAnimationFrame(tick);
}
function stopReel(r, finalEmoji) {
  r.active = false;
  if (r.animId) { cancelAnimationFrame(r.animId); r.animId = null; }
  r.strip.style.transition = 'transform 0.3s ease-out';
  while (r.strip.firstChild) r.strip.removeChild(r.strip.firstChild);
  for (let i = 0; i < STRIP_LEN; i++) {
    const s = document.createElement('span'); s.textContent = finalEmoji; r.strip.appendChild(s);
  }
  r.offset = 0; r.strip.style.transform = 'translateY(0)';
  setTimeout(() => { r.strip.style.transition = ''; }, 320);
}
function resetReels() {
  for (let i = 0; i < 3; i++) {
    const strip = $('strip' + i);
    while (strip.firstChild) strip.removeChild(strip.firstChild);
    for (let j = 0; j < STRIP_LEN; j++) {
      const s = document.createElement('span'); s.textContent = randEmoji(); strip.appendChild(s);
    }
    reels[i].offset = 0; reels[i].active = false;
    if (reels[i].animId) { cancelAnimationFrame(reels[i].animId); reels[i].animId = null; }
    strip.style.transform = 'translateY(0)';
    $('reel' + i).className = 'reel';
  }
}
function stopReelsRandomly(cls) {
  const picks = []; const pool = [...EMOJIS];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picks.push(pool[idx]); pool.splice(idx, 1);
  }
  for (let i = 0; i < 3; i++) {
    $('reel' + i).className = 'reel ' + (cls || 'stop');
    stopReel(reels[i], picks[i]);
  }
}

/* ---------- Валидация ---------- */
function validate() {
  const prefix = $('prefix').value.trim();
  const suffix = $('suffix').value.trim();
  if (!prefix) { alert('Укажите префикс'); return null; }
  if (!prefix.startsWith('1')) { alert('Префикс должен начинаться с "1"'); return null; }
  let s, e, bs = 65536n;
  try {
    s = BigInt('0x' + $('start').value.trim().replace(/^0x/i, ''));
    e = BigInt('0x' + $('end').value.trim().replace(/^0x/i, ''));
  } catch { alert('Некорректный диапазон'); return null; }
  if (e < s) { alert('Конец < начала'); return null; }
  const bsStr = $('blockSize').value.trim();
  if (bsStr) { try { bs = BigInt(bsStr); if (bs < 1024n) bs = 1024n; } catch {} }
  const size = e - s + 1n;
  const blocks = (size + bs - 1n) / bs;
  return { prefix, suffix, s, e, rangeSize: size, blockSize: bs, blocksCount: blocks };
}

/* ---------- Старт/стоп ---------- */
function startSearch() {
  const p = validate(); if (!p) return;
  stopWinSound();
  spinning = true; stopped = false;
  workerDoneSet.clear();
  globalCount = 0;
  lastCounts.clear();
  startTime = Date.now();
  blockLog = [];
  renderBlockLog();

  /* Фильтр */
  let filterK = 0;
  let maskBuffer = null;
  try {
    const f = buildPrefixFilter(p.prefix);
    if (f) {
      filterK = f.K;
      const size = f.mask.length;
      if (typeof SharedArrayBuffer !== 'undefined') {
        try {
          const sab = new SharedArrayBuffer(size);
          new Uint8Array(sab).set(f.mask);
          maskBuffer = sab;
        } catch { maskBuffer = f.mask.buffer; }
      } else {
        maskBuffer = f.mask.buffer;
      }
    }
  } catch (err) { console.warn('filter build failed', err); }

  let nw = 4;
  try { nw = parseInt($('threads').value, 10); if (!Number.isFinite(nw) || nw < 1) nw = 1; if (nw > 64) nw = 64; } catch {}
  workerCountGlobal = nw;

  const totalBlocks = p.blocksCount;
  const permA = totalBlocks > 1n ? randomCoprime(totalBlocks) : 1n;
  const permB = totalBlocks > 1n ? (randomBigInt(64) % totalBlocks) : 0n;

  let workBlocks, workBlockSize, workRangeS, workRangeE, maxPerWorker;

  if (autoMode) {
    workBlocks = totalBlocks;
    workBlockSize = p.blockSize;
    workRangeS = p.s;
    workRangeE = p.e;
    maxPerWorker = (workBlocks + BigInt(nw) - 1n) / BigInt(nw);
  } else {
    /* Ручной: берём ОЧЕРЕДНОЙ блок диапазона, перемешанный coprime-множителем.
       Позиция сохраняется между запусками в sessionBlockIdx. */
    if (sessionTotalBlocks !== totalBlocks) {
      /* Диапазон или blockSize изменились — сбрасываем сессию. */
      sessionTotalBlocks = totalBlocks;
      sessionBlockIdx = 0n;
      sessionPermA = totalBlocks > 1n ? randomCoprime(totalBlocks) : 1n;
      sessionPermB = totalBlocks > 1n ? (randomBigInt(64) % totalBlocks) : 0n;
    }

    const idx = sessionBlockIdx;
    const pidx = totalBlocks > 1n ? ((sessionPermA * idx + sessionPermB) % totalBlocks) : 0n;
    workBlocks = 1n;
    workBlockSize = p.blockSize;
    workRangeS = p.s + pidx * p.blockSize;
    workRangeE = (workRangeS + p.blockSize - 1n > p.e) ? p.e : (workRangeS + p.blockSize - 1n);
    maxPerWorker = 1n;

    /* Сдвигаем на следующий блок для следующего запуска. */
    sessionBlockIdx += 1n;
    if (sessionBlockIdx >= totalBlocks) {
      /* Прошли весь диапазон — начинаем заново с новой перестановкой. */
      sessionBlockIdx = 0n;
      sessionPermA = totalBlocks > 1n ? randomCoprime(totalBlocks) : 1n;
      sessionPermB = totalBlocks > 1n ? (randomBigInt(64) % totalBlocks) : 0n;
    }
  }

  $('spin').textContent = '⏹ СТОП';
  $('spin').classList.add('stop');
  $('spin').disabled = false;
  ['prefix','suffix','start','end','blockSize','threads'].forEach(id => $(id).disabled = true);
  resetReels();
  for (let i = 0; i < 3; i++) { $('reel'+i).className = 'reel spinning'; startReel(reels[i], 8 + i*3); }

  if (autoMode) {
    sessionTargetKeys = Number(workBlocks * workBlockSize);
  } else {
    sessionTargetKeys = Number(workRangeE - workRangeS + 1n);
  }
  setResult([
    (autoMode ? '🔁 Авто' : '🎲 Ручной') + ' — поиск...',
    '<span class="label">Префикс:</span> ' + p.prefix,
    filterK ? '<span class="label">Фильтр:</span> ' + filterK + ' байт h160' : '<span class="label">Фильтр:</span> нет',
    autoMode
      ? '<span class="label">Диапазон:</span> ' + workBlocks.toString() + ' блоков × ' + workBlockSize.toString() + ' ключей'
      : '<span class="label">Блок:</span> 0x' + workRangeS.toString(16) + '…0x' + workRangeE.toString(16),
    '<span class="label">Воркеров:</span> ' + nw,
  ], 'searching');

  const blob = new Blob([workerCode()], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  for (let i = 0; i < nw; i++) {
    const w = new Worker(url);
    w.onmessage = e => handleWorker(e, i);
    w.onerror = err => console.error('worker', err);
    w.postMessage({
      cmd: 'run',
      workerId: i,
      workerCount: nw,
      prefix: p.prefix,
      suffix: p.suffix,
      rangeS: workRangeS.toString(16),
      rangeE: workRangeE.toString(16),
      blockSize: workBlockSize.toString(),
      totalBlocks: workBlocks.toString(),
      permA: permA.toString(),
      permB: permB.toString(),
      maxBlocks: maxPerWorker.toString(),
      filterK,
      maskBuffer,
    });
    workers.push(w);
    lastCounts.set(i, 0);
  }
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  startRate();
}

function stopSearch() {
  if (!spinning) return;
  stopWinSound();
  stopped = true; spinning = false;
  killWorkers();
  $('spin').textContent = '🎲 КРУТИТЬ';
  $('spin').classList.remove('stop');
  $('spin').disabled = false;
  ['prefix','suffix','start','end','blockSize','threads'].forEach(id => $(id).disabled = false);
  stopReelsRandomly('stop');
  setResult(['⏹ Остановлено.'], 'stopped');
}

function killWorkers() {
  workers.forEach(w => { try { w.postMessage({ cmd: 'stop' }); w.terminate(); } catch {} });
  workers = [];
  stopRate();
}

/* ---------- Статистика ---------- */
function recalc() {
  globalCount = 0;
  for (const v of lastCounts.values()) globalCount += v;
}
function startRate() {
  stopRate();
  rateTimer = setInterval(() => {
    if (stopped) return;
    const el = Math.max(0.001, (Date.now() - startTime) / 1000);
    const r = globalCount / el / 1000;
    $('rate').textContent = r.toFixed(1);
    $('count').textContent = globalCount.toLocaleString('en-US');
    const pct = sessionTargetKeys > 0 ? Math.min(100, globalCount / sessionTargetKeys * 100) : 0;
    $('percent').textContent = (pct < 0.001 && pct > 0) ? '<0.001%' : pct.toFixed(3) + '%';
    $('progress').style.width = pct + '%';
    if (r > 0 && sessionTargetKeys > globalCount) {
      const rem = (sessionTargetKeys - globalCount) / (r * 1000);
      $('eta').textContent = rem < 60 ? rem.toFixed(0) + ' с'
                          : rem < 3600 ? (rem / 60).toFixed(1) + ' мин'
                          : rem < 86400 ? (rem / 3600).toFixed(1) + ' ч'
                          : (rem / 86400).toFixed(0) + ' дн';
    } else {
      $('eta').textContent = '—';
    }
    if (autoMode && spinning) {
      setResult([
        '🔁 Авто — поиск...',
        '<span class="label">Префикс:</span> ' + $('prefix').value.trim(),
        filterK ? '<span class="label">Фильтр:</span> ' + filterK + ' байт h160' : '<span class="label">Фильтр:</span> нет',
        '<span class="label">Проверено:</span> ' + globalCount.toLocaleString('en-US'),
      ], 'searching');
    }
  }, 300);
}
function stopRate() { if (rateTimer) { clearInterval(rateTimer); rateTimer = null; } }

/* ---------- Звук победы ---------- */
function playWin() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [523.25, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'square'; o.frequency.value = f;
      const t = now + i * 0.1;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.start(t); o.stop(t + 0.2);
    });
  } catch {}
}

    '<span class="label">Проверено ключей:</span> ' + globalCount.toLocaleString('en-US'),
    '<span class="label">Не найдено. Нажмите «Крутить» — следующий блок.</span>',
  ], 'stopped');
}

/* ---------- Обработка сообщений воркеров ---------- */
function handleWorker(e, idx) {
  if (stopped) return;
  const d = e.data;
  if (d.type === 'STAT') {
    lastCounts.set(idx, (lastCounts.get(idx) || 0) + d.count);
    recalc();
  } else if (d.type === 'blockStart') {
    const bS = BigInt('0x' + d.start), bE = BigInt('0x' + d.end);
    pushBlockLog(d.start, d.end, idx, (bE - bS + 1n).toString());
  } else if (d.type === 'done') {
    workerDoneSet.add(idx);
    if (workerDoneSet.size >= workerCountGlobal && !stopped) finishNotFound();
  } else if (d.type === 'HIT') {
    stopped = true; spinning = false;
    killWorkers();
    $('spin').textContent = '🎲 КРУТИТЬ';
    $('spin').classList.remove('stop');
    $('spin').disabled = false;
    ['prefix','suffix','start','end','blockSize','threads'].forEach(id => $(id).disabled = false);
    finishWin(d);
  }
}

/* ---------- Кнопки ---------- */
function onSpin() { if (spinning) stopSearch(); else startSearch(); }
$('spin').addEventListener('click', onSpin);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (spinning) stopSearch(); }
  else if (e.key === 'Enter') {
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag !== 'INPUT') onSpin();
  }
});

resetReels();
renderBlockLog();
</script>
</body>
