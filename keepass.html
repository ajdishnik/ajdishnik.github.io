<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDBX Редактор v4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        :root { --pico-font-size: 85%; }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; height: 100vh; }
        .app { display: flex; height: 100vh; }

        /* --- Боковая панель --- */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            border-right: 1px solid var(--pico-muted-border-color);
            background: var(--pico-card-background-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, width 0.25s ease;
            overflow: hidden;
        }
        .sidebar.collapsed { width: 0; border-right: none; }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem; border-bottom: 1px solid var(--pico-muted-border-color);
            flex-shrink: 0;
        }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 0.5rem; }

        /* --- Дерево --- */
        .group-tree { list-style: none; padding-left: 0; margin: 0; }
        .group-tree ul { list-style: none; padding-left: 1rem; margin: 0; }
        .group-node {
            cursor: pointer; padding: 0.35rem 0.5rem; border-radius: 4px;
            display: flex; align-items: center; gap: 4px;
            font-size: 0.85rem; user-select: none;
        }
        .group-node:hover { background: var(--pico-secondary-background); }
        .group-node.active { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
        .group-toggle {
            width: 16px; height: 16px; flex-shrink: 0; display: flex;
            align-items: center; justify-content: center;
            font-size: 0.7rem; opacity: 0.6; cursor: pointer;
            transition: transform 0.15s;
        }
        .group-toggle.expanded { transform: rotate(90deg); }
        .group-toggle.empty { visibility: hidden; }
        .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .group-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
        .group-node:hover .group-actions { opacity: 1; }
        .group-actions button {
            padding: 0 3px; font-size: 0.7rem; line-height: 1.4;
            background: transparent; border: 1px solid currentColor;
            border-radius: 3px; color: inherit; cursor: pointer;
        }
        .group-actions button:hover { background: rgba(128,128,128,0.2); }

        /* --- Основная область --- */
        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem; border-bottom: 1px solid var(--pico-muted-border-color);
            flex-shrink: 0;
        }
        .main-header h3 { margin: 0; flex: 1; font-size: 1rem; }
        .main-content { flex: 1; display: flex; overflow: hidden; }
        .entries-pane { flex: 1; overflow-y: auto; padding: 0.75rem; min-width: 0; }
        .entries-pane.with-editor { flex: 0 0 320px; border-right: 1px solid var(--pico-muted-border-color); }

        /* --- Записи --- */
        .entry-item {
            cursor: pointer; padding: 0.5rem 0.6rem; border-radius: 6px;
            margin-bottom: 2px;
        }
        .entry-item:hover { background: var(--pico-secondary-background); }
        .entry-item.active { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
        .entry-item strong { font-size: 0.9rem; display: block; }
        .meta-text { font-size: 0.75rem; opacity: 0.7; }

        /* --- Редактор --- */
        .editor-pane {
            flex: 1; overflow-y: auto; padding: 1rem; min-width: 0;
            display: flex; flex-direction: column;
        }
        .editor-pane.hidden { display: none; }
        .field-group { margin-bottom: 0.75rem; }
        .field-group label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.15rem; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--pico-muted-border-color); }
        .actions button { padding: 0.4rem 0.8rem; font-size: 0.85rem; }

        /* --- Кнопка гамбургер --- */
        .hamburger {
            background: transparent; border: none; cursor: pointer;
            padding: 0.3rem; font-size: 1.2rem; color: inherit;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- Мобильная адаптация --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
                transform: translateX(0); box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            }
            .sidebar.collapsed { transform: translateX(-100%); width: 280px; }
            .entries-pane.with-editor { display: none; }
            .editor-pane { width: 100%; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="app">
    <!-- Боковая панель с деревом групп -->
    <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <strong>Группы</strong>
            <div style="display: flex; gap: 0.3rem;">
                <button id="addGroupBtn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" title="Создать подгруппу">+</button>
                <button class="hamburger" id="closeSidebarBtn" title="Скрыть панель">◀</button>
            </div>
        </div>
        <div class="sidebar-content">
            <ul id="groupTree" class="group-tree"></ul>
			
			
        </div>
    </aside>

    <!-- Основная область -->
    <div class="main-area">
        <!-- Экран открытия базы -->
        <div id="open-section" style="padding: 2rem; max-width: 500px; margin: auto; width: 100%;">
            <h2>KDBX Редактор</h2>
            <label>Файл <input type="file" id="fileInput" accept=".kdbx"></label>
            <label>Мастер-пароль <input type="password" id="masterPassword"></label>
            <button id="openBtn">Открыть базу</button>
        </div>

        <!-- Основной интерфейс после открытия -->
        <div id="main-section" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div class="main-header">
                <button class="hamburger" id="toggleSidebarBtn" title="Показать/скрыть панель">☰</button>
                <h3 id="currentGroupName">Записи</h3>
                <button id="addEntryBtn" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">+ Запись</button>
                <button id="downloadBtn" class="contrast" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">Скачать .kdbx</button>
            </div>

            <div class="main-content">
                <!-- Список записей -->
                <div class="entries-pane" id="entriesPane">
                    <input type="search" id="searchInput" placeholder="Поиск..." style="margin-bottom: 0.75rem; padding: 0.3rem; font-size: 0.85rem;">
                    <div id="entriesList"></div>
                </div>

                <!-- Редактор записи -->
                <div class="editor-pane hidden" id="editorPane">
                    <div id="noSelection" style="text-align: center; padding: 2rem; opacity: 0.6;">
                        <p>Выберите запись из списка</p>
                    </div>
                    <div id="editForm" class="hidden">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h4 id="editHeading" style="margin: 0;">Редактирование</h4>
                            <button id="closeEditorBtn" style="background: transparent; border: none; cursor: pointer; font-size: 1.2rem; padding: 0 0.3rem;" title="Закрыть">✕</button>
                        </div>
                        <div class="field-group"><label>Заголовок</label><input id="fTitle"></div>
                        <div class="field-group"><label>Логин</label><input id="fUsername"></div>
                        <div class="field-group"><label>Пароль</label><input id="fPassword"></div>
                        <div class="field-group"><label>URL</label><input id="fUrl"></div>
                        <div class="field-group"><label>Заметки</label><textarea id="fNotes" rows="3"></textarea></div>
                        <div class="field-group">
                            <label>Группа (перемещение)</label>
                            <select id="fGroupSelect"></select>
                        </div>
                        <div class="actions">
                            <button id="saveBtn">Сохранить</button>
                            <button id="deleteEntryBtn" class="secondary">Удалить запись</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import init, { KdbxDatabase } from 'https://esm.sh/kdbx-wasm@0.3.1';
    await init();

    let db = null, currentFile = null, selectedUuid = null, currentGroupUuid = null;
    const $ = id => document.getElementById(id);

    // ---------- Управление боковой панелью ----------
    const sidebar = $('sidebar');
    $('toggleSidebarBtn').addEventListener('click', () => sidebar.classList.toggle('collapsed'));
    $('closeSidebarBtn').addEventListener('click', () => sidebar.classList.add('collapsed'));

    // ---------- Открытие ----------
    $('openBtn').addEventListener('click', async () => {
        const file = $('fileInput').files[0];
        const pw = $('masterPassword').value;
        if (!file || !pw) return alert('Выберите файл и введите пароль');
        try {
            const buf = await file.arrayBuffer();
			db = new KdbxDatabase(new Uint8Array(buf), pw);
			currentFile = file;
			currentGroupUuid = db.rootGroupUuid;
			sidebar.classList.remove('collapsed');   // ← добавить эту строку
			$('open-section').classList.add('hidden');
			$('main-section').classList.remove('hidden');
            $('main-section').style.display = 'flex';
            renderGroups();
            renderEntries();
            populateGroupSelect();
            updateCurrentGroupName();
        } catch (e) { alert('Ошибка открытия: ' + e.message); }
    });

    // ---------- Вспомогательные ----------
    function updateCurrentGroupName() {
        const g = db.getGroup(currentGroupUuid);
        $('currentGroupName').textContent = g ? g.name : 'Записи';
    }

    // ---------- Дерево групп ----------
    // Храним состояние раскрытия групп в памяти
    const expandedGroups = new Set();

    function renderGroups() {
        const groups = db.getGroups();
        const childrenMap = new Map();
        groups.forEach(g => {
            const pid = g.parentId || '__root__';
            if (!childrenMap.has(pid)) childrenMap.set(pid, []);
            childrenMap.get(pid).push(g);
        });

        const tree = $('groupTree');
        tree.innerHTML = '';

        // Автоматически раскрываем родителей текущей группы
        let parent = groups.find(g => g.uuid === currentGroupUuid);
        while (parent && parent.parentId) {
            expandedGroups.add(parent.parentId);
            parent = groups.find(g => g.uuid === parent.parentId);
        }
        // Корень всегда раскрыт
        if (db.rootGroupUuid) expandedGroups.add(db.rootGroupUuid);

        function buildNode(group, container) {
            const li = document.createElement('li');
            const div = document.createElement('div');
            div.className = 'group-node' + (group.uuid === currentGroupUuid ? ' active' : '');

            // Кнопка-треугольник для раскрытия
            const children = childrenMap.get(group.uuid) || [];
            const toggle = document.createElement('span');
            toggle.className = 'group-toggle' + (children.length ? '' : ' empty');
            if (expandedGroups.has(group.uuid)) toggle.classList.add('expanded');
            toggle.textContent = '▶';
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (expandedGroups.has(group.uuid)) expandedGroups.delete(group.uuid);
                else expandedGroups.add(group.uuid);
                renderGroups();
            });
            div.appendChild(toggle);

            // Название
            const nameSpan = document.createElement('span');
            nameSpan.className = 'group-name';
            nameSpan.textContent = group.name;
            div.appendChild(nameSpan);

            // Кнопки действий
            const actions = document.createElement('span');
            actions.className = 'group-actions';

            const renameBtn = document.createElement('button');
            renameBtn.textContent = '✎';
            renameBtn.title = 'Переименовать';
            renameBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const newName = prompt('Новое имя группы:', group.name);
                if (newName && newName.trim() && newName !== group.name) {
                    try {
                        db.renameGroup(group.uuid, newName.trim());
                        renderGroups();
                        updateCurrentGroupName();
                        populateGroupSelect();
                    } catch (err) { alert('Ошибка: ' + err.message); }
                }
            });
            actions.appendChild(renameBtn);

            if (group.uuid !== db.rootGroupUuid) {
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.title = 'Удалить группу';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleDeleteGroup(group.uuid, group.name);
                });
                actions.appendChild(delBtn);
            }
            div.appendChild(actions);

            // Клик по группе
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                currentGroupUuid = group.uuid;
                selectedUuid = null;
                closeEditor();
                renderGroups();
                renderEntries();
                updateCurrentGroupName();
                // На мобильных скрываем сайдбар после выбора
                if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
            });

            li.appendChild(div);

            // Дочерние группы — показываем только если раскрыто
            if (children.length && expandedGroups.has(group.uuid)) {
                const ul = document.createElement('ul');
                children.forEach(c => buildNode(c, ul));
                li.appendChild(ul);
            }
            container.appendChild(li);
        }

        // Корневая группа
        const rootGroup = db.getGroup(db.rootGroupUuid);
        if (rootGroup) {
            const rootLi = document.createElement('li');
            const rootDiv = document.createElement('div');
            rootDiv.className = 'group-node' + (rootGroup.uuid === currentGroupUuid ? ' active' : '');
            rootDiv.innerHTML = `<strong class="group-name">${escapeHtml(rootGroup.name)}</strong>`;
            rootDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                currentGroupUuid = rootGroup.uuid;
                selectedUuid = null;
                closeEditor();
                renderGroups();
                renderEntries();
                updateCurrentGroupName();
                if (window.innerWidth <= 768) sidebar.classList.add('collapsed');
            });
            rootLi.appendChild(rootDiv);

            const rootChildren = childrenMap.get(rootGroup.uuid) || [];
            if (rootChildren.length && expandedGroups.has(rootGroup.uuid)) {
                const ul = document.createElement('ul');
                rootChildren.forEach(c => buildNode(c, ul));
                rootLi.appendChild(ul);
            }
            tree.appendChild(rootLi);
        }
    }

    // ---------- Удаление группы ----------
    function handleDeleteGroup(uuid, name) {
        if (uuid === db.rootGroupUuid) { alert('Нельзя удалить корневую группу.'); return; }
        const groups = db.getGroups();
        const childGroups = groups.filter(g => g.parentId === uuid);
        const entries = db.getEntriesByGroup(uuid);
        if (entries.length > 0 || childGroups.length > 0) {
            let msg = `Группа «${name}» не пуста.`;
            if (entries.length) msg += `\nЗаписей: ${entries.length}`;
            if (childGroups.length) msg += `\nПодгрупп: ${childGroups.length}`;
            msg += '\n\nСначала удалите или переместите всё содержимое.';
            alert(msg); return;
        }
        if (!confirm(`Удалить группу «${name}»?`)) return;
        try {
            db.deleteGroup(uuid);
            if (currentGroupUuid === uuid) {
                const parent = groups.find(g => g.uuid === uuid)?.parentId || db.rootGroupUuid;
                currentGroupUuid = parent;
                selectedUuid = null;
                closeEditor();
            }
            renderGroups(); renderEntries(); populateGroupSelect(); updateCurrentGroupName();
        } catch (e) { alert('Ошибка удаления: ' + e.message); }
    }

    // ---------- Создание группы ----------
    $('addGroupBtn').addEventListener('click', () => {
        if (!db) return;
        const name = prompt('Имя новой группы:');
        if (!name || !name.trim()) return;
        try {
            db.createGroup(name.trim(), currentGroupUuid);
            expandedGroups.add(currentGroupUuid);
            renderGroups(); populateGroupSelect();
        } catch (e) { alert('Ошибка: ' + e.message); }
    });

    // ---------- Записи ----------
    function renderEntries() {
        const list = $('entriesList');
        list.innerHTML = '';
        let entries;
        const q = $('searchInput').value.trim();
        if (q) entries = db.searchEntries(q, true);
        else entries = db.getEntriesByGroup(currentGroupUuid, true);
        if (!entries.length) {
            list.innerHTML = '<p class="meta-text" style="padding:1rem;text-align:center;">Нет записей</p>';
            return;
        }
        entries.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'entry-item' + (entry.uuid === selectedUuid ? ' active' : '');
            div.innerHTML = `<strong>${escapeHtml(entry.title || 'Без названия')}</strong>
                <div class="meta-text">${escapeHtml(entry.username || '')}</div>`;
            div.addEventListener('click', () => selectEntry(entry.uuid));
            list.appendChild(div);
        });
    }

    $('searchInput').addEventListener('input', () => { if (db) renderEntries(); });

    // ---------- Выбор записи → открываем редактор ----------
    function selectEntry(uuid) {
        selectedUuid = uuid;
        renderEntries();
        const entry = db.getEntry(uuid, true);
        if (!entry) return;

        // Показываем редактор
        $('entriesPane').classList.add('with-editor');
        $('editorPane').classList.remove('hidden');
        $('noSelection').classList.add('hidden');
        $('editForm').classList.remove('hidden');
        $('editHeading').textContent = entry.title || 'Запись';

        $('fTitle').value = entry.title || '';
        $('fUsername').value = entry.username || '';
        $('fPassword').value = entry.password || '';
        $('fUrl').value = entry.url || '';
        $('fNotes').value = entry.notes || '';
        populateGroupSelect(entry.groupUuid);
    }

    // ---------- Закрытие редактора ----------
    function closeEditor() {
        selectedUuid = null;
        $('editorPane').classList.add('hidden');
        $('entriesPane').classList.remove('with-editor');
        $('editForm').classList.add('hidden');
        $('noSelection').classList.remove('hidden');
        renderEntries();
    }
    $('closeEditorBtn').addEventListener('click', closeEditor);

    // ---------- Заполнение select групп ----------
    function populateGroupSelect(selectedGroupUuid) {
        const sel = $('fGroupSelect');
        sel.innerHTML = '';
        const groups = db.getGroups();
        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.uuid;
            opt.textContent = g.name;
            if (g.uuid === (selectedGroupUuid || currentGroupUuid)) opt.selected = true;
            sel.appendChild(opt);
        });
    }

    // ---------- Создание записи ----------
    $('addEntryBtn').addEventListener('click', () => {
        if (!db) return;
        const now = new Date();
        const formatted = new Intl.DateTimeFormat('ru-RU', {
            day: 'numeric', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }).format(now).replace(/\u00A0/g, ' ');
        const defaultTitle = `# ${formatted}`;
        const title = prompt('Название записи:', defaultTitle);
        if (!title || !title.trim()) return;
        try {
            const uuid = db.createEntry(currentGroupUuid, title.trim(), '');
            selectedUuid = uuid;
            renderEntries();
            renderGroups();
            selectEntry(uuid);
        } catch (e) { alert(e.message); }
    });

    // ---------- Сохранение ----------
    $('saveBtn').addEventListener('click', () => {
        if (!selectedUuid) return;
        try {
            db.setEntryTitle(selectedUuid, $('fTitle').value.trim() || undefined);
            db.setEntryUsername(selectedUuid, $('fUsername').value.trim() || undefined);
            db.setEntryPassword(selectedUuid, $('fPassword').value);
            db.setEntryUrl(selectedUuid, $('fUrl').value.trim() || undefined);
            db.setEntryNotes(selectedUuid, $('fNotes').value.trim() || undefined);
            const targetGroup = $('fGroupSelect').value;
            if (targetGroup !== db.getEntry(selectedUuid).groupUuid) {
                db.moveEntry(selectedUuid, targetGroup);
                currentGroupUuid = targetGroup;
            }
            renderGroups();
            renderEntries();
            updateCurrentGroupName();
            $('editHeading').textContent = $('fTitle').value || 'Запись';
            alert('Применено в памяти. Скачайте файл для сохранения.');
        } catch (e) { alert(e.message); }
    });

    // ---------- Удаление записи ----------
    $('deleteEntryBtn').addEventListener('click', () => {
        if (!selectedUuid || !confirm('Удалить запись?')) return;
        try {
            db.deleteEntry(selectedUuid);
            closeEditor();
            renderEntries();
            renderGroups();
        } catch (e) { alert(e.message); }
    });

    // ---------- Скачивание ----------
    $('downloadBtn').addEventListener('click', () => {
        if (!db || !currentFile) return;
        try {
            const bytes = db.toBytes($('masterPassword').value);
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFile.name.replace('.kdbx', '_edited.kdbx');
            a.click();
            URL.revokeObjectURL(url);
        } catch (e) { alert(e.message); }
    });

    // ---------- Утилита ----------
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }
</script>
</body>
</html>
