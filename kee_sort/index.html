<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KDBX Редактор</title>
<style>
    :root {
        --font-size: 90%;
        --radius: 12px;
        --border: 1px solid rgba(255,255,255,.18);
        --shadow: 0 4px 20px rgba(0,0,0,.18);
        --panel: rgba(20, 22, 28, .72);
        --panel-solid: rgba(20, 22, 28, .72);

        --secondary-bg: rgba(255,255,255,.08);
        --primary-bg: #3b6ef5;
        --primary-inverse: #ffffff;
        --color: #eef1f6;
        --muted-color: rgba(238, 241, 246, .6);
        --muted-border: rgba(255,255,255,.16);
        --font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html {
        height: 100%;
        touch-action: manipulation;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        font-size: var(--font-size);
        color: var(--color);
        background: #0f1115;
        -webkit-text-size-adjust: 100%;
        text-shadow: 0 1px 2px rgba(0,0,0,.35);
    }

    /* Единый фон: фото с мягким размытием */
    body::before {
        content: "";
        position: fixed;
        inset: -20px;
        background: url('./lib/2.jpg') center / cover no-repeat;
        filter: blur(18px) saturate(1.15) brightness(1);
        transform: scale(1.06);
        z-index: -2;
        pointer-events: none;
    }

    /* Затемнение + виньетка */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 100%),
            rgba(0, 0, 0, .25);
        z-index: -1;
        pointer-events: none;
    }

    input, textarea, select, button {
        font: inherit;
        color: inherit;
    }
    input, textarea, select {
        width: 100%;
        padding: .5rem .65rem;
        border: 1px solid var(--muted-border);
        border-radius: 8px;
        background: rgba(255,255,255,.06);
        color: var(--color);
        outline: none;
        transition: border-color .15s, background .15s;
        font-size: 16px !important;
    }
    input::placeholder, textarea::placeholder { color: var(--muted-color); }
    input:focus, textarea:focus, select:focus {
        border-color: var(--primary-bg);
        background: rgba(255,255,255,.1);
    }
    select option { background: #1a1d24; color: #eef1f6; }
    button {
        cursor: pointer;
        padding: .5rem .85rem;
        border: 1px solid var(--muted-border);
        border-radius: 8px;
        background: rgba(255,255,255,.06);
        color: var(--color);
        transition: background .15s;
        font-size: 16px !important;
    }
    button:hover { background: rgba(255,255,255,.12); }

    .btn.secondary { background: rgba(255,255,255,.1); border-color: transparent; }
    .btn.contrast  { background: var(--primary-bg); color: var(--primary-inverse); border-color: transparent; }
    .btn.contrast:hover { filter: brightness(1.08); }

    .app { display: flex; height: 100vh; height: 100dvh; }

    /* ============ Боковая панель ============ */
    .sidebar {
        width: 280px;
        flex-shrink: 0;
            background: rgba(10, 11, 15, .85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        transition: width .22s ease, transform .22s ease;
        overflow: hidden;
        z-index: 100;
    }
	
    .sidebar.collapsed { width: 0; border-right: none; }
    .sidebar-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: calc(.75rem + var(--safe-top)) .9rem .75rem .9rem;
        border-bottom: 1px solid rgba(255,255,255,.08);
        flex-shrink: 0;
    }
    .sidebar-header strong { font-size: .95rem; letter-spacing: .2px; }
    .sidebar-content {
        flex: 1; overflow-y: auto;
        padding: .5rem .4rem calc(.5rem + var(--safe-bottom)) .4rem;
    }

    .icon-btn {
        background: transparent; border: none; cursor: pointer;
        color: inherit; border-radius: 8px;
        width: 32px; height: 32px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 1rem; line-height: 1;
        transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.1); }

    /* ============ Дерево ============ */
    .group-tree, .group-tree ul { list-style: none; margin: 0; padding-left: 0; }
    .group-tree ul { padding-left: 1rem; }
.group-node {
    cursor: pointer;
    padding: .35rem .45rem;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: .85rem;
    user-select: none;
    transition: background .15s;
    min-height: 40px;              /* <-- добавить */
    -webkit-tap-highlight-color: transparent;  /* <-- убрать серую вспышку на iOS */
}
.group-node:active { background: rgba(255,255,255,.12); }
    .group-node:hover { background: rgba(255,255,255,.06); }
    .group-node.active {
        background: var(--primary-bg);
        color: var(--primary-inverse);
    }
.group-toggle {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    opacity: .7;
    cursor: pointer;
    transition: transform .15s, background .15s;
    border-radius: 8px;
    /* НЕ выходим за пределы строки */
    margin: 0;
}
.group-toggle:active { background: rgba(255,255,255,.14); }
	
	
    .group-toggle.expanded { transform: rotate(90deg); }
    .group-toggle.empty { visibility: hidden; }
    .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .group-node:hover .group-actions { opacity: 1; }
    .group-actions button {
        padding: 0 3px; font-size: .7rem; line-height: 1.4;
        background: transparent; border: 1px solid currentColor;
        border-radius: 4px; color: inherit; cursor: pointer;
    }
    .group-actions button:hover { background: rgba(255,255,255,.15); }

    /* ============ Основная область ============ */
    .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* Экран открытия */
    #open-section {
        display: flex; align-items: center; justify-content: center;
        padding: calc(1.5rem + var(--safe-top)) 1.5rem calc(1.5rem + var(--safe-bottom)) 1.5rem;
        flex: 1;
    }
    .open-card {
        width: 100%; max-width: 440px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.75rem;
    }
    .open-card h2 { margin: 0 0 .25rem; font-size: 1.35rem; }
    .open-card p { margin: 0 0 1.25rem; color: var(--muted-color); font-size: .85rem; }
    .open-card label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: .35rem; }
    .open-card input { margin-bottom: .75rem; }
    .open-card button { width: 100%; margin-top: .25rem; }

    /* Шапка */
    .main-header {
        display: flex; align-items: center; gap: .5rem;
        padding: calc(.6rem + var(--safe-top)) calc(.9rem + var(--safe-right)) .6rem calc(.9rem + var(--safe-left));
        border-bottom: 1px solid rgba(255,255,255,.08);
        background: var(--panel-solid);
        flex-shrink: 0;
    }
    .main-header h3 {
        margin: 0; flex: 1; font-size: .95rem;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .main-header .btn {
        padding: .4rem .8rem; font-size: .8rem; border-radius: 8px;
        white-space: nowrap;
    }

    /* Контент */
    .main-content { flex: 1; display: flex; overflow: hidden; }

    .entries-pane {
        flex: 1; overflow-y: auto; padding: .75rem; min-width: 0;
        padding-bottom: calc(.75rem + var(--safe-bottom));
        background: var(--panel-solid);
        border-right: 1px solid rgba(255,255,255,.08);
    }
    .entries-pane.with-editor {
        flex: 0 0 340px;
    }

    /* ============ Записи ============ */
    .entry-item {
        cursor: pointer; padding: .6rem .75rem;
        border-radius: 10px; margin-bottom: 4px;
        transition: background .15s;
        border: 1px solid transparent;
    }
    .entry-item:hover { background: rgba(255,255,255,.06); }
    .entry-item.active {
        background: var(--primary-bg);
        color: var(--primary-inverse);
        border-color: transparent;
    }
    .entry-item.active .meta-text { color: rgba(255,255,255,.8); }
    .entry-item strong { font-size: .9rem; display: block; font-weight: 600; }
    .meta-text { font-size: .75rem; color: var(--muted-color); margin-top: 2px; }
    .empty-state {
        text-align: center; padding: 2rem 1rem; color: var(--muted-color);
        font-size: .85rem;
    }

    /* ============ Редактор ============ */
    .editor-pane {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: transparent;
        overflow: hidden;
        position: relative;
        isolation: isolate;
        clip-path: inset(0);
    }
    .editor-pane.hidden { display: none !important; }

    /* Фон редактора = точная копия body::before */
    .editor-pane::before {
        content: "";
        position: fixed;
        inset: -20px;
        background: url('./lib/2.jpg') center / cover no-repeat;
        filter: blur(18px) saturate(1.15) brightness(1);
        transform: scale(1.06);
        z-index: -2;
        pointer-events: none;
    }
    .editor-pane::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 100%),
            rgba(0, 0, 0, .25);
        z-index: -1;
        pointer-events: none;
    }

    .editor-header {
        display: flex;
        align-items: center;
        gap: .6rem;
        padding: calc(.6rem + var(--safe-top)) calc(.9rem + var(--safe-right)) .6rem calc(.9rem + var(--safe-left));
        border-bottom: 1px solid rgba(255,255,255,.08);
        background: var(--panel-solid);
        flex-shrink: 0;
    }
    .editor-header h4 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: .95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
	

    .back-btn {
        background: transparent;
        border: 1px solid var(--muted-border);
        border-radius: 8px;
        padding: .3rem .7rem;
        font-size: .8rem;
        cursor: pointer;
        color: inherit;
        white-space: nowrap;
        transition: background .15s;
        flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,.1); }

    .editor-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 1rem;
        background: rgba(15, 17, 21, .55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    #noSelection {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: var(--muted-color);
    }

    #editForm {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #editForm.hidden { display: none !important; }

    #editForm .field-group {
        margin-bottom: .8rem;
        flex-shrink: 0;
    }
    #editForm .field-group:last-child {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin-bottom: 0;
        overflow: hidden;
    }

    .field-group label {
        font-size: .78rem;
        font-weight: 600;
        display: block;
        margin-bottom: .25rem;
        color: var(--muted-color);
        flex-shrink: 0;
    }
    .field-group input,
    .field-group textarea,
    .field-group select {
        margin-bottom: 0;
    }

    #fTitle {
        border: none;
        background: transparent;
        box-shadow: none;
        padding: .25rem .1rem;
        font-size: 1.15rem;
        font-weight: 600;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,.08);
        border-radius: 0;
    }
    #fTitle:focus {
        outline: none;
        box-shadow: none;
        border-bottom-color: var(--primary-bg);
        background: transparent;
    }

    #fNotes {
        flex: 1;
        min-height: 0;
        width: 100%;
        resize: none;
        overflow-y: auto;
        border: none;
        background: rgba(255,255,255,.04);
        border-radius: 8px;
        padding: .6rem .7rem;
        line-height: 1.5;
    }
    #fNotes:focus {
        outline: none;
        box-shadow: none;
        background: rgba(255,255,255,.07);
    }

    /* ============ Оверлей ============ */
    .overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,.5);
        z-index: 90;
        opacity: 0; pointer-events: none;
        transition: opacity .2s;
    }
    .overlay.visible { opacity: 1; pointer-events: auto; }

    .hidden { display: none !important; }

    /* ============ Мобильная адаптация ============ */
    @media (max-width: 768px) {
        body { overflow: hidden; }
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; height: 100dvh;
            width: 280px; transform: translateX(0);
            box-shadow: 4px 0 24px rgba(0,0,0,.35);
        }
        .sidebar.collapsed {
            transform: translateX(-100%);
            width: 280px;
        }
        .main-area { width: 100%; }

        .entries-pane.with-editor { flex: 1; border-right: none; }

        .editor-pane {
            position: fixed;
            inset: 0;
            z-index: 200;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            background: transparent;
        }
        .editor-pane.hidden { display: none !important; }

        .main-header .btn { padding: .3rem .55rem; font-size: .75rem; }
        .main-header h3 { font-size: .85rem; }
    }
	
	
	.meta-text {
    font-size: .75rem;
    color: var(--muted-color);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;      /* сколько строк показывать */
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-line;      /* сохраняем переводы строк */
    line-height: 1.35;
}

</style>
</head>
<body>
<div class="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <strong>Группы</strong>
            <div style="display: flex; gap: .2rem;">
                <button id="addGroupBtn" class="icon-btn" title="Новая подгруппа">+</button>
                <button id="closeSidebarBtn" class="icon-btn" title="Скрыть">✕</button>
            </div>
        </div>
        <div class="sidebar-content">
    <div class="group-node" id="allEntriesItem"
         style="font-weight: 700; color: red;">
        <span class="group-toggle empty"></span>
        <span class="group-name">Все записи</span>
    </div>
    <ul id="groupTree" class="group-tree"></ul>
</div>
    </aside>

    <div class="main-area">
        <div id="open-section">
            <div class="open-card">
                <h2>KDBX Редактор</h2>
                <p>Откройте базу KeePass прямо в браузере</p>
                <label>Файл базы
                    <input type="file" id="fileInput" accept=".kdbx">
                </label>
                <label>Мастер-пароль
                    <input type="password" id="masterPassword" placeholder="••••••••">
                </label>
                <button id="openBtn" class="btn contrast">Открыть</button>
            </div>
        </div>

        <div id="main-section" class="hidden" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <div class="main-header">
                <button class="icon-btn" id="toggleSidebarBtn" title="Показать/скрыть панель">☰</button>
                <h3 id="currentGroupName">Записи</h3>
                <button id="addEntryBtn" class="btn secondary">+ Запись</button>
                <button id="downloadBtn" class="btn contrast">Скачать .kdbx</button>
            </div>

            <div class="main-content">


<div class="entries-pane" id="entriesPane">
    <div style="display:flex; gap:.5rem; margin-bottom:.75rem;">
        <input type="search" id="searchInput" placeholder="Поиск..." style="flex:1;">
        <select id="sortSelect" style="width:auto; flex-shrink:0; font-size:.85rem;" title="Сортировка"></select>
    </div>
    <div id="entriesList"></div>
</div>



                <div class="editor-pane hidden" id="editorPane">
                    <div class="editor-header">
                        <button id="closeEditorBtn" class="back-btn">← Назад</button>
                        <h4 id="editHeading">Редактирование</h4>
                        <button id="deleteEntryBtn" class="icon-btn" title="Удалить запись">🗑</button>
                    </div>

                    <div class="editor-body">
                        <div id="noSelection" class="empty-state">
                            <p>Выберите запись из списка</p>
                        </div>

                        <div id="editForm" class="hidden">
                            <div class="field-group"><label>Заголовок</label><input id="fTitle"></div>

                            <div class="hidden">
                                <div class="field-group"><label>Логин</label><input id="fUsername"></div>
                                <div class="field-group"><label>Пароль</label><input id="fPassword"></div>
                                <div class="field-group"><label>URL</label><input id="fUrl"></div>
                                <div class="field-group">
                                    <label>Группа (перемещение)</label>
                                    <select id="fGroupSelect"></select>
                                </div>
                            </div>

                            <div class="field-group"><label>Заметки</label><textarea id="fNotes" rows="3"></textarea></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}

import init, { KdbxDatabase } from './lib/kdbx_wasm.js';
import { sortEntries, getSortType, setSortType, mountSortSelect } from './lib/sort.js';

await init({
    module_or_path: './lib/kdbx_wasm_bg.wasm'
});

let showingAllEntries = false;
let db = null, currentFile = null, selectedUuid = null, currentGroupUuid = null;
const $ = id => document.getElementById(id);
const sidebar = $('sidebar');
const overlay = $('overlay');
const expandedGroups = new Set();

const isMobile = () => window.innerWidth <= 768;

function openSidebar() {
    sidebar.classList.remove('collapsed');
    if (isMobile()) overlay.classList.add('visible');
}
function closeSidebar() {
    sidebar.classList.add('collapsed');
    overlay.classList.remove('visible');
}
$('toggleSidebarBtn').addEventListener('click', () => {
    sidebar.classList.contains('collapsed') ? openSidebar() : closeSidebar();
});
$('closeSidebarBtn').addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

function highlightActiveSidebarItem(id) {
    document.querySelectorAll('#groupTree .group-node').forEach(el => el.classList.remove('active'));
    $('allEntriesItem').classList.remove('active');
    const el = $(id);
    if (el) el.classList.add('active');
}


$('allEntriesItem').addEventListener('click', () => {
    if (!db) return;
    showingAllEntries = true;
    currentGroupUuid = db.rootGroupUuid;
    closeEditor();
	renderGroups();                    // ← добавить: перестроит дерево, active с групп снимется
    updateCurrentGroupName();
    renderEntries();
    highlightActiveSidebarItem('allEntriesItem');
    if (isMobile()) closeSidebar();
});

$('openBtn').addEventListener('click', async () => {
    const file = $('fileInput').files[0];
    const pw = $('masterPassword').value;
    if (!file || !pw) return alert('Выберите файл и введите пароль');
    try {
        const buf = await file.arrayBuffer();
        db = new KdbxDatabase(new Uint8Array(buf), pw);
        currentFile = file;
        currentGroupUuid = db.rootGroupUuid;

        $('open-section').classList.add('hidden');
        $('main-section').classList.remove('hidden');
        $('main-section').style.display = 'flex';

        showingAllEntries = true;
        closeSidebar();

        renderGroups();
        renderEntries();
        populateGroupSelect();
        updateCurrentGroupName();
    } catch (e) { alert('Ошибка открытия: ' + e.message); }
});

function updateCurrentGroupName() {
    if (showingAllEntries) {
        $('currentGroupName').textContent = 'Все записи';
        return;
    }
    const g = db.getGroup(currentGroupUuid);
    $('currentGroupName').textContent = g ? g.name : 'Записи';
}

function highlightActiveGroup(groupUuid) {
    document.querySelectorAll('#groupTree .group-node').forEach(el => el.classList.remove('active'));
    // построчный поиск: активный — тот, у кого data-uuid совпадает
    const target = document.querySelector(`#groupTree .group-node[data-uuid="${groupUuid}"]`);
    if (target) target.classList.add('active');
    $('allEntriesItem').classList.remove('active');
}

function renderGroups() {
    const groups = db.getGroups();
    const childrenMap = new Map();
    groups.forEach(g => {
        const pid = g.parentId || '__root__';
        if (!childrenMap.has(pid)) childrenMap.set(pid, []);
        childrenMap.get(pid).push(g);
    });

    const tree = $('groupTree');
    tree.innerHTML = '';

    // Автораскрытие пути до текущей группы
    let parent = groups.find(g => g.uuid === currentGroupUuid);
    while (parent && parent.parentId) {
        expandedGroups.add(parent.parentId);
        parent = groups.find(g => g.uuid === parent.parentId);
    }
    if (db.rootGroupUuid) expandedGroups.add(db.rootGroupUuid);

    function buildNode(group, container) {
        const li = document.createElement('li');
        const div = document.createElement('div');
        div.className = 'group-node' + (group.uuid === currentGroupUuid ? ' active' : '');
        div.dataset.uuid = group.uuid;

        const children = childrenMap.get(group.uuid) || [];

        // --- треугольник ---
        const toggle = document.createElement('span');
        toggle.className = 'group-toggle' + (children.length ? '' : ' empty');
        if (expandedGroups.has(group.uuid)) toggle.classList.add('expanded');
        toggle.textContent = '▶';
        toggle.dataset.toggle = '1';
        div.appendChild(toggle);

        // --- имя ---
        const nameSpan = document.createElement('span');
        nameSpan.className = 'group-name';
        nameSpan.textContent = group.name;
        div.appendChild(nameSpan);

        // --- кнопки ✎ / ✕ ---
        const actions = document.createElement('span');
        actions.className = 'group-actions';

        const renameBtn = document.createElement('button');
        renameBtn.textContent = '✎';
        renameBtn.title = 'Переименовать';
        renameBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const newName = prompt('Новое имя группы:', group.name);
            if (newName && newName.trim() && newName !== group.name) {
                try {
                    db.renameGroup(group.uuid, newName.trim());
                    renderGroups();
                    updateCurrentGroupName();
                    populateGroupSelect();
                } catch (err) { alert('Ошибка: ' + err.message); }
            }
        });
        actions.appendChild(renameBtn);

        if (group.uuid !== db.rootGroupUuid) {
            const delBtn = document.createElement('button');
            delBtn.textContent = '✕';
            delBtn.title = 'Удалить';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleDeleteGroup(group.uuid, group.name);
            });
            actions.appendChild(delBtn);
        }
        div.appendChild(actions);

        // --- вложенный список создаём ЗАРАНЕЕ (важно!) ---
        let ul = null;
        if (children.length) {
            ul = document.createElement('ul');
            children.forEach(c => buildNode(c, ul));
            ul.hidden = !expandedGroups.has(group.uuid);
        }

        // --- ОДИН обработчик на строку ---
        div.addEventListener('click', (e) => {
            e.stopPropagation();

            // Тап по треугольнику → раскрыть/свернуть без перерисовки
            if (e.target.closest('[data-toggle="1"]')) {
                if (!ul) return;
                const isExpanded = expandedGroups.has(group.uuid);
                if (isExpanded) {
                    expandedGroups.delete(group.uuid);
                    ul.hidden = true;
                    toggle.classList.remove('expanded');
                } else {
                    expandedGroups.add(group.uuid);
                    ul.hidden = false;
                    toggle.classList.add('expanded');
                }
                return;
            }

            // Иначе — выбор группы
            showingAllEntries = false;
            currentGroupUuid = group.uuid;
            closeEditor();
            renderEntries();
            updateCurrentGroupName();
            highlightActiveGroup(group.uuid);
            if (isMobile()) closeSidebar();
        });

        li.appendChild(div);
        if (ul) li.appendChild(ul);
        container.appendChild(li);
    }

    // --- корень ---
    const rootGroup = db.getGroup(db.rootGroupUuid);
    if (rootGroup) {
        const rootLi = document.createElement('li');
        const rootDiv = document.createElement('div');
        rootDiv.className = 'group-node' + (rootGroup.uuid === currentGroupUuid ? ' active' : '');
        rootDiv.dataset.uuid = rootGroup.uuid;
        rootDiv.innerHTML = `<strong class="group-name">Корень</strong>`;

        const rootChildren = childrenMap.get(rootGroup.uuid) || [];
        let rootUl = null;
        if (rootChildren.length) {
            rootUl = document.createElement('ul');
            rootChildren.forEach(c => buildNode(c, rootUl));
            rootUl.hidden = !expandedGroups.has(rootGroup.uuid);
        }

        rootDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            showingAllEntries = false;
            currentGroupUuid = rootGroup.uuid;
            closeEditor();
            renderEntries();
            updateCurrentGroupName();
            highlightActiveGroup(rootGroup.uuid);
            if (isMobile()) closeSidebar();
        });

        rootLi.appendChild(rootDiv);
        if (rootUl) rootLi.appendChild(rootUl);
        tree.appendChild(rootLi);
    }

    if (showingAllEntries) {
        highlightActiveSidebarItem('allEntriesItem');
    } else {
        $('allEntriesItem').classList.remove('active');
    }
}





function handleDeleteGroup(uuid, name) {
    if (uuid === db.rootGroupUuid) { alert('Нельзя удалить корневую группу.'); return; }
    const groups = db.getGroups();
    const childGroups = groups.filter(g => g.parentId === uuid);
    const entries = db.getEntriesByGroup(uuid);
    if (entries.length > 0 || childGroups.length > 0) {
        let msg = `Группа «${name}» не пуста.`;
        if (entries.length) msg += `\nЗаписей: ${entries.length}`;
        if (childGroups.length) msg += `\nПодгрупп: ${childGroups.length}`;
        msg += '\n\nСначала удалите или переместите всё содержимое.';
        alert(msg); return;
    }
    if (!confirm(`Удалить группу «${name}»?`)) return;
    try {
        db.deleteGroup(uuid);
        if (currentGroupUuid === uuid) {
            const parent = groups.find(g => g.uuid === uuid)?.parentId || db.rootGroupUuid;
            currentGroupUuid = parent;
            closeEditor();
        }
        renderGroups(); renderEntries(); populateGroupSelect(); updateCurrentGroupName();
    } catch (e) { alert('Ошибка удаления: ' + e.message); }
}

$('addGroupBtn').addEventListener('click', () => {
    if (!db) return;
    const name = prompt('Имя новой группы:');
    if (!name || !name.trim()) return;
    try {
        db.createGroup(name.trim(), currentGroupUuid);
        expandedGroups.add(currentGroupUuid);
        renderGroups(); populateGroupSelect();
    } catch (e) { alert('Ошибка: ' + e.message); }
});

function renderEntries() {
    const list = $('entriesList');
    list.innerHTML = '';
    let entries;
    const q = $('searchInput').value.trim();

    if (q) {
        entries = db.searchEntries(q, true);
    } else if (showingAllEntries) {
        entries = db.getEntries(true);
    } else {
        entries = db.getEntriesByGroup(currentGroupUuid, true);
    }

    entries = sortEntries(entries, getSortType());

    if (!entries.length) {
        list.innerHTML = '<div class="empty-state">Нет записей</div>';
        return;
    }
    entries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'entry-item' + (entry.uuid === selectedUuid ? ' active' : '');

        const notesPreview = (entry.notes || '').slice(0, 200);
        const metaLine = notesPreview
            ? `<div class="meta-text">${escapeHtml(notesPreview)}</div>`
            : '';

        div.innerHTML = `<strong>${escapeHtml(entry.title || 'Без названия')}</strong>
            ${metaLine}`;
        div.addEventListener('click', () => selectEntry(entry.uuid));
        list.appendChild(div);
    });
}

$('searchInput').addEventListener('input', () => { if (db) renderEntries(); });

function selectEntry(uuid) {
    selectedUuid = uuid;
    renderEntries();
    const entry = db.getEntry(uuid, true);
    if (!entry) return;

    $('entriesPane').classList.add('with-editor');
    $('editorPane').classList.remove('hidden');
    $('noSelection').classList.add('hidden');
    $('editForm').classList.remove('hidden');
    $('editHeading').textContent = entry.title || 'Запись';

    $('fTitle').value = entry.title || '';
    $('fUsername').value = entry.username || '';
    $('fPassword').value = entry.password || '';
    $('fUrl').value = entry.url || '';
    $('fNotes').value = entry.notes || '';
    populateGroupSelect(entry.groupUuid);
}

function closeEditor() {
    selectedUuid = null;
    $('editorPane').classList.add('hidden');
    $('entriesPane').classList.remove('with-editor');
    $('editForm').classList.add('hidden');

    $('noSelection').classList.remove('hidden');
    renderEntries();
}
$('closeEditorBtn').addEventListener('click', closeEditor);
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('editorPane').classList.contains('hidden')) closeEditor();
});



document.addEventListener('touchstart', (e) => {
    if (e.target.closest('input, textarea, select, button, a, [contenteditable]')) return;
    if (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
        document.activeElement.blur();
    }
}, { passive: true });


function populateGroupSelect(selectedGroupUuid) {
    const sel = $('fGroupSelect');
    sel.innerHTML = '';
    const groups = db.getGroups();
    groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.uuid;
        opt.textContent = g.name;
        if (g.uuid === selectedGroupUuid) opt.selected = true;
        sel.appendChild(opt);
    });
}

$('addEntryBtn').addEventListener('click', () => {
    if (!db) return;
    const now = new Date();
    const formatted = new Intl.DateTimeFormat('ru-RU', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    }).format(now).replace(/\u00A0/g, ' ');
    const defaultTitle = `# ${formatted}`;
    const title = prompt('Название записи:', defaultTitle);
    if (!title || !title.trim()) return;
    try {
        const uuid = db.createEntry(currentGroupUuid, title.trim(), '');
        selectedUuid = uuid;
        renderEntries();
        renderGroups();
        selectEntry(uuid);
    } catch (e) { alert(e.message); }
});

function saveCurrentEntry() {
    if (!selectedUuid) return;
    try {
        db.setEntryTitle(selectedUuid, $('fTitle').value.trim() || undefined);
        db.setEntryNotes(selectedUuid, $('fNotes').value.trim() || undefined);
        // username/password/url тоже, если нужно

        renderEntries();
        $('editHeading').textContent = $('fTitle').value || 'Запись';
    } catch (e) { console.error(e); }
}

function moveCurrentEntry() {
    if (!selectedUuid) return;
    try {
        const targetGroup = $('fGroupSelect').value;
        const entry = db.getEntry(selectedUuid);
        if (targetGroup && entry && targetGroup !== entry.groupUuid) {
            db.moveEntry(selectedUuid, targetGroup);
            renderGroups();
            renderEntries();
            updateCurrentGroupName();
        }
    } catch (e) { console.error(e); }
}

$('fTitle').addEventListener('input', saveCurrentEntry);
$('fNotes').addEventListener('input', saveCurrentEntry);
$('fUsername').addEventListener('input', saveCurrentEntry);
$('fPassword').addEventListener('input', saveCurrentEntry);
$('fUrl').addEventListener('input', saveCurrentEntry);
$('fGroupSelect').addEventListener('change', moveCurrentEntry);

$('deleteEntryBtn').addEventListener('click', () => {
    if (!selectedUuid || !confirm('Удалить запись?')) return;
    try {
        db.deleteEntry(selectedUuid);
        closeEditor();
        renderEntries();
        renderGroups();
    } catch (e) { alert(e.message); }
});

$('downloadBtn').addEventListener('click', () => {
    if (!db || !currentFile) return;
    try {
        const bytes = db.toBytes($('masterPassword').value);
        const blob = new Blob([bytes], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = currentFile.name.replace('.kdbx', '_edited.kdbx');
        a.click();
        URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
});

// Инициализация селекта сортировки
mountSortSelect($('sortSelect'), getSortType(), () => {
    if (db) renderEntries();
});

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
</script>
</body>
</html>
