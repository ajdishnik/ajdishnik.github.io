
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Дата и время</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 25px 20px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        text-align: center;
    }

    #datetime {
        font-size: clamp(21px, 5vw, 28px);
        font-weight: bold;
        margin-bottom: 25px;
        overflow-wrap: anywhere;
    }

    button {
        width: 100%;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #2675e8;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    button:active {
        background: #1559bd;
        transform: scale(0.98);
    }

    .hint {
        margin-top: 15px;
        color: #888;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="container">
    <div id="datetime"></div>

    <button id="copyButton" onclick="copyDate()">
        📋 Скопировать
    </button>

    <div class="hint">Дата и время вашего устройства</div>
</div>

<script>
function updateDate() {
    const now = new Date();

    const date = now.toLocaleDateString('ru-RU', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
    }).replace(' г.', 'г.');

    const time = now.toLocaleTimeString('ru-RU', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    document.getElementById('datetime').textContent =
        `# ${date}, ${time}`;
}

async function copyDate() {
    const text = document.getElementById('datetime').textContent;
    const button = document.getElementById('copyButton');

    try {
        await navigator.clipboard.writeText(text);
    } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
    }

    button.textContent = '✓ Скопировано!';

    setTimeout(() => {
        button.textContent = '📋 Скопировать';
    }, 1500);
}

updateDate();
setInterval(updateDate, 1000);
</script>

</body>
</html>
